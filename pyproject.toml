[dependency-groups]
pre-commit = [
    "pre-commit == 4.6.1",
]

redirects = [
    "mkdocs-redirects == 1.2.3",
]

tox-uv = [
    "tox-uv == 1.36.0",
]

wlc = [
    "wlc == 2.1.1",
]

dev = [
    {include-group = "pre-commit"},
    {include-group = "tox-uv"},
]

docs = [
    "beeware-docs-tools @ git+https://github.com/beeware/beeware-docs-tools",
    # "beeware-docs-tools @ file://../beeware-docs-tools",
    {include-group = "redirects"},
]

translate = [
    {include-group = "tox-uv"},
    {include-group = "wlc"},
]

[tool.ruff.lint]
# In addition to the default rules, these additional rules will be used:
extend-select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "I",      # isort
    # The SIM rules are *very* opinionated, and don't necessarily make for better code.
    # They may be worth occasionally turning on just to see if something could actually
    # use improvement.
    # "SIM",    # flake8-simplify
]
# Ignores needed to pass the Ruff 0.16 update.
ignore = [
    "BLE001",
    "DTZ001",
    "DTZ005",
    "DTZ006",
    "DTZ011",
    "DTZ012",
    "RUF009",
    # The SIM rules are *very* opinionated, and don't necessarily make for better code.
    "SIM102",  # collapsible-if makes code (and testing paths) harder to verify.
]

[tool.rumdl]
flavor = "mkdocs"
include = ["**/*.md"]
exclude = ["comment.md", "CODE_OF_CONDUCT.md", "docs-redirect/en/README.md", ".github/ISSUE_TEMPLATE/showcase-your-app.md"]
respect-gitignore = true

# Disable rules:
# MD014: Forces commands in codeblocks to show output
# MD033: No inline HTML
disable = ["MD014", "MD033",]

[tool.rumdl.per-file-ignores]
"docs/en/about/team/*.md" = ["MD041"]

[tool.rumdl.MD013]  # Line length
line_length = 999999
reflow = true
reflow_mode = "normalize"

[tool.rumdl.MD026]  # Remove punctuation at the end of headings
punctuation = ",;:"

[tool.rumdl.MD061]  # Fail on certain strings.
terms = ["TODO"]
