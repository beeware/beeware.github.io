[tool.uv]
# On Windows, uv's isolated build environments don't include tzdata, but
# beeware-docs-tools' build backend (autocalver) calls zoneinfo.ZoneInfo("UTC"),
# which fails without it. Extend the build environment with tzdata on Windows.
extra-build-dependencies = { "beeware-docs-tools" = ["tzdata; sys_platform == 'win32'"] }

[dependency-groups]
pre-commit = [
    "pre-commit == 4.6.1",
]

redirects = [
    "mkdocs-redirects == 1.2.3",
]

tox-uv = [
    "tox-uv == 1.36.0",
]

wlc = [
    "wlc == 2.1.1",
]

dev = [
    {include-group = "pre-commit"},
    {include-group = "tox-uv"},
]

docs = [
    "beeware-docs-tools @ git+https://github.com/beeware/beeware-docs-tools",
    # "beeware-docs-tools @ file://../beeware-docs-tools",
    {include-group = "redirects"},
]

translate = [
    {include-group = "tox-uv"},
    {include-group = "wlc"},
]

[tool.ruff.lint]
# In addition to the default rules, these additional rules will be used:
extend-select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "I",      # isort
]
ignore = [
    # Blog/event post metadata is date-only and never needs timezone awareness.
    "DTZ005",
    "DTZ007",
    "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
# These files build long Markdown/HTML content from f-strings; splitting the
# lines to satisfy the line-length limit would break the generated content.
"docs/macros.py" = ["E501"]
"scripts/new_post.py" = ["E501"]

[tool.rumdl]
flavor = "mkdocs"
include = ["**/*.md"]
exclude = ["comment.md", "CODE_OF_CONDUCT.md", "docs-redirect/en/README.md", ".github/ISSUE_TEMPLATE/showcase-your-app.md"]
respect-gitignore = true

# Disable rules:
# MD014: Forces commands in codeblocks to show output
# MD033: No inline HTML
disable = ["MD014", "MD033",]

[tool.rumdl.per-file-ignores]
"docs/en/about/team/*.md" = ["MD041"]

[tool.rumdl.MD013]  # Line length
line_length = 999999
reflow = true
reflow_mode = "normalize"

[tool.rumdl.MD026]  # Remove punctuation at the end of headings
punctuation = ",;:"

[tool.rumdl.MD061]  # Fail on certain strings.
terms = ["TODO"]
