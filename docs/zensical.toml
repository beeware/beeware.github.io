    { name = "Español", link = "/es/", lang = "es" },
    { name = "فارسی", link = "/fa/", lang = "fa" },
    { name = "Français", link = "/fr/", lang = "fr" },
    { name = "Italiano", link = "/it/", lang = "it" },
    { name = "日本語", link = "/ja/", lang = "ja" },
    { name = "한국어", link = "/ko/", lang = "ko" },
    { name = "Polski", link = "/pl/", lang = "pl" },
    { name = "Português", link = "/pt/", lang = "pt" },
    { name = "Русский", link = "/ru/", lang = "ru" },
    { name = "தமிழ்", link = "/ta/", lang = "ta" },
    { name = "Türkçe", link = "/tr/", lang = "tr" },
    { name = "Yкраїнська", link = "/uk/", lang = "uk" },
    { name = "Tiếng Việt", link = "/vi/", lang = "vi" },
    { name = "中文(简体)", link = "/zh_CN/", lang = "zh-Hant" },
    { name = "中文(繁體)", link = "/zh_TW/", lang = "zh-TW" },
]

[project.theme]
name = "material"
language = "en"
logo = "assets/images/brutus-256.png"
favicon = "assets/images/brutus-256.png"
features = [
    "content.tabs.link",
    "toc.follow",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.indexes",
    "navigation.sections",
    "navigation.path",
    "navigation.expand",
    "search.suggest",
    "search.highlight",
    "search.share",
]
custom_dir = "overrides"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
# Python Markdown extensions
toc.permalink = true
toc.title = "On this page"
attr_list = {}
md_in_html = {}
smarty.smart_quotes = false
# PyMdown Extensions
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.blocks.caption = {}
pymdownx.blocks.admonition.types = [
    "note",
    "abstract",
    "info",
    "tip",
    "success",
    "question",
    "warning",
    "failure",
    "danger",
    "bug",
    "example",
    "quote",
]
pymdownx.blocks.details.types = [
    { name = "details-note", class = "note" },
    { name = "details-abstract", class = "abstract" },
    { name = "details-info", class = "info" },
    { name = "details-tip", class = "tip" },
    { name = "details-success", class = "success" },
    { name = "details-question", class = "question" },
    { name = "details-warning", class = "warning" },
    { name = "details-failure", class = "failure" },
    { name = "details-danger", class = "danger" },
    { name = "details-bug", class = "bug" },
    { name = "details-example", class = "example" },
    { name = "details-quote", class = "quote" },
]
pymdownx.blocks.tab.alternate_style = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.url_download = true
pymdownx.snippets.check_paths = true

[project.plugins.search]

[project.plugins.blog]
blog_dir = "news"
post_url_date_format = "yyyy"
post_url_format = "{categories}/{date}/{slug}"
post_url_max_categories = 1
categories_url_format = "{slug}"
categories_allowed = ["Buzz", "Events", "Resources"]

[project.plugins.autorefs]
resolve_closest = true  # autorefs warns of the Usage headings begin duplicates without this - we will have to assign unique ids to all of them otherwise

[project.plugins.macros]
module_name = "macros"

[project.plugins.macros.include_yaml]
team = "en/news/.authors.yml"

[project.plugins.meta]

[project.plugins.rss]
feed_title = "BeeWare: The Buzz"
feed_description = "News and events for the BeeWare project."
match_path = "news/posts/.*"
use_git = false  # Forces it to read the dates from the frontmatter.
categories = ["categories"]
# image = "images/brutus.png"  # Update to a Brutus URL
abstract_chars_count = -1

[project.plugins.rss.date_from_meta]
as_creation = "date"
datetime_format = "%Y-%m-%d"

[project.plugins.rss.feeds_filenames]
rss_created = "news/buzz/atom.xml"

