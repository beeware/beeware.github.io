# This is the only way to keep the build from parsing the team bio files.
exclude_docs = """
!.*
/about/team/
"""
extra_css = ["stylesheets/beeware.css"]
site_url = "https://beeware.org/"

[project.validation]
omitted_files = "warn"
absolute_links = "relative_to_docs"
anchors = "warn"
unrecognized_links = "warn"

[project.extra]
project_name = "beeware"
formal_name = "BeeWare"
hide_dev_links = true
website = true
translated = true
min_python_version = "3.10"  # The oldest supported Python version
min_python_version_tag = "310"  # The tag version of the minimum python version
recent_python_version = "3.13"  # The newest Python version known to work on all platforms
docs_python_version = "3.13"  # The version of Python required to build the documentation
contribution_guide_root = "contributing/guide/"
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/beeware", name = "BeeWare on GitHub" },
    { icon = "fontawesome/brands/mastodon", link = "https://fosstodon.org/@beeware", name = "BeeWare on Mastodon" },
    { icon = "fontawesome/brands/discord", link = "https://beeware.org/bee/chat/", name = "BeeWare on Discord" },
    { icon = "fontawesome/solid/square-rss", name = "BeeWare blog RSS feed", link = "https://beeware.org/news/buzz/atom.xml" },
]
generator = false
alternate = [
    { name = "English", link = "/en/", lang = "en" },
    { name = "العَرَبِيَّة", link = "/ar/", lang = "ar" },
    { name = "Čeština", link = "/cs/", lang = "cs" },
