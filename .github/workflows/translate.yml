name: Update Translations
on:
  push:
    branches:
      main

defaults:
  run:
    shell: bash  # https://github.com/beeware/briefcase/pull/912

env:
  FORCE_COLOR: "1"

jobs:
  update-translations:
    name: Update Translations
    if: github.repository == 'beeware/beeware.github.io' && github.actor != 'brutusthebee'
    runs-on: ubuntu-latest
    # GitHub writes use BRUTUS_PAT_TOKEN, so the job's own GITHUB_TOKEN needs
    # no permissions.
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ secrets.BRUTUS_PAT_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.X"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .pre-commit-config.yaml

      - name: Update pip
        run: python -m pip install -U pip

      - name: Install tox
        run: python -m pip install --group translate

      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.BRUTUS_PAT_TOKEN }}
        run: |
          git config --local user.email "$(git log --pretty='%ae' -1)"
          git config --local user.name "brutusthebee[bot]"
          gh auth setup-git

      - name: Configure Weblate
        env:
          WEBLATE_API_TOKEN: ${{ secrets.WEBLATE_API_TOKEN }}
        run: |
          cat <<EOF > ~/.weblate
          [weblate]
          url = https://hosted.weblate.org/api/
          translation = beeware/website
          retries = 5
          backoff_factor = 2
          status_forcelist = 423
          allowed_methods = GET,POST,PUT,DELETE,HEAD,OPTIONS

          [keys]
          https://hosted.weblate.org/api/ = $WEBLATE_API_TOKEN
          EOF

      - name: Lock Weblate and Sync
        run: wlc lock
      - name: Commit Weblate changes
        run: wlc commit
      - name: Push Weblate changes
        run: wlc push
      - name: Pull translation updates pushed by Weblate
        env:
          GH_TOKEN: ${{ secrets.BRUTUS_PAT_TOKEN }}
        run: git pull origin

      - name: Regenerate PO files
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          tox -e docs-translate

      - name: Update Needed?
        id: updated
        run: |
          if [[ $(git status --porcelain) ]]; then
            echo "updated=true" >> ${GITHUB_OUTPUT}
          else
            echo "updated=false" >> ${GITHUB_OUTPUT}
          fi

      - name: Commit updated translations
        if: steps.updated.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.BRUTUS_PAT_TOKEN }}
        run: |
          # Commit the updated PO files.
          git add docs/locales
          git commit -m "Update translations to $(git rev-parse --short HEAD)."
          git push origin

      - name: Ensure Weblate has current updates
        if: steps.updated.outputs.updated == 'true'
        run: wlc pull

      - name: Unlock Weblate
        if: always()
        run: wlc unlock

      # # This step is only needed if you're trying to diagnose test failures that
      # # only occur in CI, and can't be reproduced locally. When it runs, it will
      # # open an SSH server (URL reported in the logs) so you can ssh into the CI
      # # machine.
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   if: failure()
